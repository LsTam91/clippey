[project]
name = "clippey"
version = "0.1.0"
description = "Crée automatiquement des clips verticaux viraux à partir de vidéos longues"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "yt-dlp>=2026.6.9",
    "mlx-whisper>=0.4; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mediapipe>=0.10.35",
    "scenedetect[opencv]>=0.7",
]

[project.optional-dependencies]
gpu = ["faster-whisper>=1.1; sys_platform == 'linux'"]

[project.scripts]
clippey = "clippey.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clippey"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# le format ASS impose des définitions de style sur une seule ligne
"src/clippey/compose/subtitles.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
